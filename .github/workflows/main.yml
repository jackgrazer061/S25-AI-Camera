name: Build S25 AI Camera APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Download Real-ESRGAN x4 AI model
        run: |
          mkdir -p app/src/main/assets

          curl -L --fail --retry 3 \
          "https://github.com/kongxa/RealESRGAN_x4plus/raw/main/RealESRGAN_x4plus.onnx" \
          -o app/src/main/assets/realesrgan_x4plus.onnx

          echo "AI x4 model:"
          ls -lh app/src/main/assets/realesrgan_x4plus.onnx

          test $(stat -c%s app/src/main/assets/realesrgan_x4plus.onnx) -gt 50000000

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk S25-AI-Camera-v0.4.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: S25-AI-Camera-v0.5
          path: S25-AI-Camera-v0.5.apk
          if-no-files-found: error
